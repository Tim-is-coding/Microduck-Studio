[project]
name = "duckstudio"
version = "0.0.1"
description = "Duck Studio runtime: executes behavior packs for the Microduck against mock, sim or real backends."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "pydantic>=2.8",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=2",
  "pillow>=10",
  "anthropic>=1.7,<2",   # Claude as a perception vendor (ADR-0004, ADR-0009); keys come from the Studio
]

[project.optional-dependencies]
vlm = []  # kept so `uv sync --extra vlm` from older notes still works; anthropic is a dependency now

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duckstudio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]  # explicit `timeout` params on the JSON-RPC connection are intended
