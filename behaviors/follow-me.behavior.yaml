schema: duckstudio.behavior/v0
id: follow-me
name: { de: Folge mir, en: Follow me }
summary:
  de: "Die Ente sucht die nächste Person, läuft ihr in Abstand nach und quakt, wenn du „Stopp“ sagst."
trigger:
  kind: speech
  phrases: { de: ["Folge mir", "Komm mit"], en: ["Follow me"] }
steps:
  - perceive: person.nearest
    on_none: { do: look_around, seconds: 5, then: retry }
  - skill: walk
    with: { direction: toward_person, tempo: easy, distance: 60 }
    until: { any: [speech: { de: ["Stopp"] }, elapsed: 10m] }
  - skill: quack
    with: { style: short }
always:
  - on: fallen
    do: [getup, resume]
